<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ゆびっこ写真">
    <title>ゆびっこ写真アプリ</title>
    <link rel="manifest" href="data:application/json,{%22name%22:%22ゆびっこ写真アプリ%22,%22short_name%22:%22ゆびっこ写真%22,%22start_url%22:%22/%22,%22display%22:%22standalone%22,%22background_color%22:%22%23ffffff%22,%22theme_color%22:%22%23667eea%22,%22scope%22:%22/%22,%22icons%22:[{%22src%22:%22data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%23667eea' width='192' height='192'/><text x='50%' y='50%' font-size='120' dominant-baseline='central' text-anchor='middle' fill='white'>📷</text></svg>%22,%22sizes%22:%22192x192%22,%22type%22:%22image/svg+xml%22,%22purpose%22:%22any%22}]}">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23667eea'/><text x='50' y='55' font-size='60' text-anchor='middle' fill='white'>📷</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #f5f5f5;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: white;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 16px;
            text-align: center;
            flex-shrink: 0;
            padding-top: max(12px, env(safe-area-inset-top));
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            margin: 0;
        }

        .header p {
            font-size: 11px;
            opacity: 0.8;
            margin: 4px 0 0 0;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 12px;
        }

        .section {
            margin-bottom: 12px;
            background: #f8f8f8;
            border-radius: 12px;
            padding: 12px;
        }

        .section-title {
            font-size: 12px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            display: block;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: white;
            border: 1.5px solid #ddd;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .canvas-wrapper {
            width: 100%;
            aspect-ratio: 1;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 12px;
            display: none;
        }

        .canvas-wrapper.active {
            display: block;
        }

        #videoElement, #photoCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #videoElement {
            transform: scaleX(-1);
        }

        .char-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 8px;
        }

        .char-btn {
            aspect-ratio: 1;
            padding: 0;
            border: 2px solid #ddd;
            background: white;
            border-radius: 8px;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .char-btn:active {
            transform: scale(0.95);
        }

        .char-btn.active {
            border: 2px solid #667eea;
            background: #e8eeff;
        }

        .char-input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 12px;
            background: white;
        }

        .decoration-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            margin-bottom: 8px;
        }

        .deco-btn {
            aspect-ratio: 1;
            padding: 0;
            border: 2px solid #ddd;
            background: white;
            border-radius: 8px;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .deco-btn:active {
            transform: scale(0.95);
        }

        .deco-btn.active {
            border: 2px solid #667eea;
            background: #667eea;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        .controls button {
            padding: 12px;
            border: none;
            background: #667eea;
            color: white;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .controls button:active {
            transform: scale(0.98);
        }

        .controls button.secondary {
            background: #f0f0f0;
            color: #333;
        }

        .slider-group {
            margin-bottom: 10px;
        }

        .slider-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 6px;
            display: block;
            font-weight: 500;
        }

        input[type="range"] {
            width: 100%;
            height: 4px;
            cursor: pointer;
            accent-color: #667eea;
        }

        input[type="file"] {
            display: none;
        }

        .status {
            text-align: center;
            font-size: 12px;
            padding: 8px;
            background: #f5f5f5;
            border-radius: 8px;
            color: #999;
            margin-top: 8px;
        }

        .status.success {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status.loading {
            color: #667eea;
        }

        .footer {
            padding: 12px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            text-align: center;
            font-size: 11px;
            color: #999;
            flex-shrink: 0;
            border-top: 1px solid #eee;
        }

        .install-prompt {
            display: none;
            padding: 12px;
            background: #667eea;
            color: white;
            border-radius: 8px;
            margin-bottom: 12px;
            text-align: center;
            font-size: 13px;
        }

        .install-prompt.show {
            display: block;
        }

        .install-prompt button {
            background: white;
            color: #667eea;
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            margin-left: 8px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
        }

        @media (max-width: 480px) {
            .char-grid {
                grid-template-columns: repeat(4, 1fr);
            }

            .decoration-grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1>🎥 ゆびっこ写真</h1>
            <p>キャラで写真をデコレーション✨</p>
        </div>

        <div class="content">
            <div id="installPrompt" class="install-prompt"></div>

            <!-- モード選択 -->
            <div class="tabs">
                <button class="tab-btn active" onclick="switchMode('camera')">📷 カメラ</button>
                <button class="tab-btn" onclick="switchMode('upload')">🖼️ アップロード</button>
            </div>

            <!-- キャンバス -->
            <div class="canvas-wrapper active" id="cameraWrapper">
                <video id="videoElement" playsinline></video>
            </div>
            <div class="canvas-wrapper" id="uploadWrapper">
                <canvas id="photoCanvas"></canvas>
            </div>

            <!-- キャラ選択 -->
            <div class="section">
                <label class="section-title">🎪 キャラを選ぶ</label>
                <div class="char-grid" id="charGrid"></div>
                <input type="text" class="char-input" id="customUrl" placeholder="カスタムURL" onchange="loadCustomCharacter()">
            </div>

            <!-- 操作ボタン -->
            <div class="controls">
                <button id="captureBtn" onclick="capturePhoto()">📸 撮影</button>
                <button class="secondary" onclick="document.getElementById('fileInput').click()">📁 選択</button>
                <button class="secondary" onclick="resetPhoto()">🔄 リセット</button>
                <button class="secondary" id="downloadBtn" style="display:none" onclick="downloadPhoto()">💾 保存</button>
            </div>

            <!-- デコレーション -->
            <div class="section">
                <label class="section-title">✨ フレーム</label>
                <div class="decoration-grid" id="frameGrid"></div>
            </div>

            <div class="section">
                <label class="section-title">🎨 フィルター</label>
                <div class="decoration-grid" id="filterGrid"></div>
            </div>

            <!-- スライダー -->
            <div class="section">
                <div class="slider-group">
                    <label class="slider-label">サイズ</label>
                    <input type="range" id="sizeSlider" min="0.5" max="2" step="0.1" value="1" onchange="updatePreview()">
                </div>
                <div class="slider-group">
                    <label class="slider-label">透明度</label>
                    <input type="range" id="opacitySlider" min="0.3" max="1" step="0.1" value="1" onchange="updatePreview()">
                </div>
            </div>

            <div class="status" id="status">準備中...</div>
        </div>

        <div class="footer">
            ホーム画面に追加してアプリとして使用できます
        </div>
    </div>

    <input type="file" id="fileInput" accept="image/*" onchange="loadPhoto(event)">

    <script>
        // ========== グローバル変数 ==========
        let video, canvas, ctx;
        let currentMode = 'camera';
        let selectedCharacter = null;
        let characterImage = null;
        let currentFrame = 'none';
        let currentFilter = 'none';
        let scale = 1, opacity = 1;
        let facesDetected = [];

        const characters = [
            { name: '普通', emoji: '😊', url: 'https://kantarokotasan-a11y.github.io/yubikko-game/body-normal.png' },
            { name: '痩せ', emoji: '🤏', url: 'https://kantarokotasan-a11y.github.io/yubikko-game/body-thin.png' },
            { name: '太め', emoji: '🍔', url: 'https://kantarokotasan-a11y.github.io/yubikko-game/body-fat.png' },
            { name: 'マッチョ', emoji: '💪', url: 'https://kantarokotasan-a11y.github.io/yubikko-game/body-macho.png' },
            { name: '病気', emoji: '🤒', url: 'https://kantarokotasan-a11y.github.io/yubikko-game/body-sick.png' },
        ];

        const frames = [
            { name: 'なし', emoji: '⭕', id: 'none' },
            { name: 'レインボー', emoji: '🌈', id: 'rainbow' },
            { name: 'ハート', emoji: '💖', id: 'heart' },
            { name: '星', emoji: '⭐', id: 'star' },
            { name: '花', emoji: '🌸', id: 'flower' },
            { name: '✨', emoji: '✨', id: 'sparkle' },
        ];

        const filters = [
            { name: '標準', emoji: '📷', id: 'none' },
            { name: 'セピア', emoji: '📜', id: 'sepia' },
            { name: 'グレー', emoji: '🤎', id: 'gray' },
            { name: '反転', emoji: '🔄', id: 'invert' },
            { name: 'ぼかし', emoji: '💨', id: 'blur' },
            { name: '彩度', emoji: '🎨', id: 'saturate' },
        ];

        // ========== 初期化 ==========
        window.addEventListener('DOMContentLoaded', async () => {
            video = document.getElementById('videoElement');
            canvas = document.getElementById('photoCanvas');
            ctx = canvas.getContext('2d');

            // UI構築
            buildCharacterGrid();
            buildFrameGrid();
            buildFilterGrid();

            // 最初のキャラ選択
            selectCharacter(characters[0], 0);

            // PWA インストール
            setupInstallPrompt();

            // Service Worker登録
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('data:text/javascript,self.addEventListener("fetch",e=>{})');
            }

            updateStatus('準備完了！', false);
        });

        function buildCharacterGrid() {
            const grid = document.getElementById('charGrid');
            characters.forEach((char, i) => {
                const btn = document.createElement('button');
                btn.className = 'char-btn' + (i === 0 ? ' active' : '');
                btn.innerHTML = char.emoji;
                btn.title = char.name;
                btn.onclick = () => selectCharacter(char, i);
                grid.appendChild(btn);
            });
        }

        function buildFrameGrid() {
            const grid = document.getElementById('frameGrid');
            frames.forEach(frame => {
                const btn = document.createElement('button');
                btn.className = 'deco-btn' + (frame.id === 'none' ? ' active' : '');
                btn.innerHTML = frame.emoji;
                btn.title = frame.name;
                btn.onclick = () => setFrame(frame.id, btn);
                grid.appendChild(btn);
            });
        }

        function buildFilterGrid() {
            const grid = document.getElementById('filterGrid');
            filters.forEach(filter => {
                const btn = document.createElement('button');
                btn.className = 'deco-btn' + (filter.id === 'none' ? ' active' : '');
                btn.innerHTML = filter.emoji;
                btn.title = filter.name;
                btn.onclick = () => setFilter(filter.id, btn);
                grid.appendChild(btn);
            });
        }

        function selectCharacter(char, index) {
            document.querySelectorAll('#charGrid .char-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('#charGrid .char-btn')[index].classList.add('active');

            selectedCharacter = char;
            characterImage = new Image();
            characterImage.crossOrigin = 'anonymous';
            characterImage.onload = () => {
                updateStatus(`${char.name}を選択✓`, false);
                updatePreview();
            };
            characterImage.onerror = () => {
                updateStatus(`${char.name}の読込に失敗`, false);
            };
            characterImage.src = char.url;
        }

        function loadCustomCharacter() {
            const url = document.getElementById('customUrl').value.trim();
            if (!url) return;

            characterImage = new Image();
            characterImage.crossOrigin = 'anonymous';
            characterImage.onload = () => {
                updateStatus('カスタムキャラを読込✓', false);
                updatePreview();
            };
            characterImage.onerror = () => {
                updateStatus('URLが無効です', false);
            };
            characterImage.src = url;
        }

        function setFrame(frameId, btn) {
            document.querySelectorAll('#frameGrid .deco-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFrame = frameId;
            updatePreview();
        }

        function setFilter(filterId, btn) {
            document.querySelectorAll('#filterGrid .deco-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = filterId;
            updatePreview();
        }

        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            document.getElementById('cameraWrapper').classList.toggle('active', mode === 'camera');
            document.getElementById('uploadWrapper').classList.toggle('active', mode === 'upload');

            if (mode === 'camera') {
                startCamera();
                document.getElementById('captureBtn').style.display = '';
            } else {
                stopCamera();
                document.getElementById('captureBtn').style.display = 'none';
            }
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }
                });
                video.srcObject = stream;
                video.play();
                drawLoop();
            } catch (e) {
                updateStatus('カメラアクセス拒否', false);
            }
        }

        function stopCamera() {
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(t => t.stop());
            }
        }

        function drawLoop() {
            if (currentMode !== 'camera') return;
            drawVideoFrame();
            requestAnimationFrame(drawLoop);
        }

        function drawVideoFrame() {
            if (!characterImage || !characterImage.complete) return;

            const wrapper = document.getElementById('cameraWrapper');
            let drawCanvas = wrapper.querySelector('canvas');
            if (!drawCanvas) {
                drawCanvas = document.createElement('canvas');
                drawCanvas.style.position = 'absolute';
                drawCanvas.style.top = '0';
                drawCanvas.style.left = '0';
                drawCanvas.style.width = '100%';
                drawCanvas.style.height = '100%';
                wrapper.style.position = 'relative';
                wrapper.appendChild(drawCanvas);
            }

            drawCanvas.width = video.videoWidth;
            drawCanvas.height = video.videoHeight;
            const c = drawCanvas.getContext('2d');
            c.clearRect(0, 0, drawCanvas.width, drawCanvas.height);

            // 簡易顔認識（顔領域に描画）
            detectAndDrawFace(c, video);
        }

        function detectAndDrawFace(ctx, source) {
            // 簡易顔検出：中央にキャラを描画
            const w = source.videoWidth;
            const h = source.videoHeight;
            const x = w * 0.25;
            const y = h * 0.2;
            const faceWidth = w * 0.5;
            const faceHeight = h * 0.6;

            drawCharacterAt(ctx, x, y, faceWidth, faceHeight);
        }

        function drawCharacterAt(ctx, x, y, w, h) {
            const charSize = Math.max(w, h) * scale * 0.8;
            ctx.save();
            ctx.globalAlpha = opacity;
            ctx.drawImage(characterImage, x - charSize / 2, y - charSize / 2, charSize, charSize);
            ctx.restore();

            drawFrameAround(ctx, x - charSize / 2, y - charSize / 2, charSize, charSize);
        }

        function drawFrameAround(ctx, x, y, w, h) {
            if (currentFrame === 'none') return;

            ctx.strokeStyle = '#667eea';
            ctx.lineWidth = 2;

            if (currentFrame === 'heart') {
                drawHearts(ctx, x, y, w, h);
            } else if (currentFrame === 'star') {
                drawStars(ctx, x, y, w, h);
            } else {
                ctx.beginPath();
                ctx.roundRect(x - 5, y - 5, w + 10, h + 10, 10);
                ctx.stroke();
            }
        }

        function drawHearts(ctx, x, y, w, h) {
            ctx.fillStyle = '#FF1744';
            const positions = [
                [x + w / 2, y - 10],
                [x + w + 10, y + h / 2],
                [x + w / 2, y + h + 10],
                [x - 10, y + h / 2]
            ];
            positions.forEach(p => {
                ctx.fillRect(p[0] - 3, p[1] - 3, 6, 6);
            });
        }

        function drawStars(ctx, x, y, w, h) {
            ctx.fillStyle = '#FFD700';
            const positions = [
                [x + w / 2, y - 10],
                [x + w + 10, y + h / 2],
                [x + w / 2, y + h + 10],
                [x - 10, y + h / 2]
            ];
            positions.forEach(p => {
                ctx.fillRect(p[0] - 4, p[1] - 4, 8, 8);
            });
        }

        function capturePhoto() {
            const wrapper = document.getElementById('cameraWrapper');
            const drawCanvas = wrapper.querySelector('canvas');
            if (!drawCanvas) {
                updateStatus('キャプチャできません', false);
                return;
            }

            canvas.width = drawCanvas.width;
            canvas.height = drawCanvas.height;
            ctx.drawImage(drawCanvas, 0, 0);
            ctx.drawImage(video, 0, 0);

            applyFilter();
            document.getElementById('downloadBtn').style.display = '';
            updateStatus('撮影完了！', true);
        }

        function loadPhoto(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);

                    if (characterImage && characterImage.complete) {
                        drawPhotoWithCharacter(img);
                        document.getElementById('downloadBtn').style.display = '';
                        updateStatus('写真を読込✓', true);
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function drawPhotoWithCharacter(img) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0);

            const w = canvas.width;
            const h = canvas.height;
            const x = w * 0.25;
            const y = h * 0.2;
            const faceWidth = w * 0.5;

            drawCharacterAt(ctx, x, y, faceWidth, h * 0.6);
            applyFilter();
        }

        function updatePreview() {
            if (currentMode === 'camera') {
                drawVideoFrame();
            } else if (canvas.width > 0) {
                const img = new Image();
                img.onload = () => drawPhotoWithCharacter(img);
                img.src = canvas.toDataURL();
            }
        }

        function applyFilter() {
            if (currentFilter === 'none') return;

            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;

            if (currentFilter === 'sepia') {
                for (let i = 0; i < data.length; i += 4) {
                    const r = data[i], g = data[i+1], b = data[i+2];
                    data[i] = Math.min(255, r * 0.393 + g * 0.769 + b * 0.189);
                    data[i+1] = Math.min(255, r * 0.349 + g * 0.686 + b * 0.168);
                    data[i+2] = Math.min(255, r * 0.272 + g * 0.534 + b * 0.131);
                }
            } else if (currentFilter === 'gray') {
                for (let i = 0; i < data.length; i += 4) {
                    const gray = data[i] * 0.3 + data[i+1] * 0.59 + data[i+2] * 0.11;
                    data[i] = data[i+1] = data[i+2] = gray;
                }
            } else if (currentFilter === 'invert') {
                for (let i = 0; i < data.length; i += 4) {
                    data[i] = 255 - data[i];
                    data[i+1] = 255 - data[i+1];
                    data[i+2] = 255 - data[i+2];
                }
            } else if (currentFilter === 'saturate') {
                for (let i = 0; i < data.length; i += 4) {
                    const r = data[i], g = data[i+1], b = data[i+2];
                    const max = Math.max(r, g, b);
                    data[i] = Math.min(255, r + (max - r) * 0.3);
                    data[i+1] = Math.min(255, g + (max - g) * 0.3);
                    data[i+2] = Math.min(255, b + (max - b) * 0.3);
                }
            }

            ctx.putImageData(imageData, 0, 0);
        }

        function resetPhoto() {
            document.getElementById('fileInput').value = '';
            canvas.width = 0;
            document.getElementById('downloadBtn').style.display = 'none';
            switchMode('camera');
        }

        function downloadPhoto() {
            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/png');
            link.download = `yubikko_${Date.now()}.png`;
            link.click();
            updateStatus('保存しました！', true);
        }

        function updateStatus(msg, success = false) {
            const el = document.getElementById('status');
            el.textContent = msg;
            el.className = 'status' + (success ? ' success' : ' loading');
        }

        // ========== PWA インストール ==========
        let deferredPrompt = null;

        function setupInstallPrompt() {
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                showInstallPrompt();
            });

            window.addEventListener('appinstalled', () => {
                deferredPrompt = null;
                document.getElementById('installPrompt').classList.remove('show');
            });
        }

        function showInstallPrompt() {
            const prompt = document.getElementById('installPrompt');
            prompt.innerHTML = '📱 ホーム画面に追加 <button onclick="installApp()">インストール</button>';
            prompt.classList.add('show');
        }

        async function installApp() {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            console.log(`ユーザーは「${outcome}」を選択`);
            deferredPrompt = null;
        }
    </script>
</body>
</html>
